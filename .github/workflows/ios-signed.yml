name: Signed iPhone development IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign-device-app:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify signing inputs
        env:
          CERT: ${{ secrets.IOS_DEVELOPMENT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          for value in "$CERT" "$CERT_PASSWORD" "$PROFILE" "$TEAM"; do
            if test -z "$value"; then
              echo 'Missing iOS signing secret. See README signing instructions.' >&2
              exit 2
            fi
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Import signing identity and device profile
        env:
          CERT: ${{ secrets.IOS_DEVELOPMENT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/mixauto-signing.keychain-db"
          profile_file="$RUNNER_TEMP/mixauto.mobileprovision"
          printf '%s' "$CERT" | base64 -D > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE" | base64 -D > "$profile_file"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security cms -D -i "$profile_file" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          profile_app=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if [[ "$profile_team" != "$TEAM" || "$profile_app" != "$TEAM.com.artss.trackbuilder.mixautopro" ]]; then
            echo 'Provisioning profile does not match Team ID and app bundle ID.' >&2
            exit 3
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_file" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Archive and export signed development IPA
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project DJTrackBuilderMixAutoPro.xcodeproj \
            -scheme DJTrackBuilderMixAutoPro -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MixAutoPro.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Development' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>development</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$TEAM</string>
          <key>provisioningProfiles</key><dict>
          <key>com.artss.trackbuilder.mixautopro</key><string>$PROFILE_NAME</string>
          </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MixAutoPro.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/signed"
          find "$RUNNER_TEMP/signed" -maxdepth 1 -name '*.ipa' -type f -size +0c | grep -q .
      - name: Upload signed iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: MixAutoPro-signed-iPhone-development-IPA
          path: ${{ runner.temp }}/signed/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          if test -n "${KEYCHAIN_PATH:-}"; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/mixauto.mobileprovision" "$RUNNER_TEMP/profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/cert.p12"
