name: C/C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native audio core
        run: cmake -S . -B .build -DCMAKE_BUILD_TYPE=Release
      - name: Build DSP and test binaries
        run: cmake --build .build --parallel 2
      - name: Test DSP and deck controls
        run: ctest --test-dir .build --output-on-failure
